# Project Configuration

# Paths
paths:
  templates: docs/templates
  knowledge_base: knowledge_base
  data: data
  models: code/tools/src/models
  utils: code/tools/src/utils

# Active Inference parameters. Read by cognitive.settings.load_settings and
# turned into an InferenceConfig; see docs/config/settings.md.
active_inference:
  default_precision: 1.0
  temporal_horizon: 3
  learning_rate: 0.5 # weight of the new posterior in each belief update, in (0, 1]
  exploration_factor: 0.0 # extra weight on information gain; 0 is the canonical objective
  discount_factor: 0.95

# How `cognitive simulate` and `cognitive sweep` run an episode.
simulation:
  method: variational # variational, sampling or mean_field
  policy_aggregation: marginal # marginal or min
  temperature: 1.0
  policy_limit: 4096
  num_samples: 256
  steps: 20
  seed: 0

# Where results go and how figures are written.
output:
  directory: output
  figure_format: png # png, svg or pdf
  dpi: 150

# Knowledge Base Settings
knowledge_base:
  auto_linking: true
  link_distance: 2
  min_relationship_strength: 0.3
  max_relationships_per_node: 50
  update_frequency: "daily"

# Template Settings
templates:
  default_confidence: 0.7
  default_precision: 1.0
  auto_update_timestamps: true
  required_fields:
    - id
    - type
    - created
    - modified

# Visualization
visualization:
  network_layout: "force_directed"
  seed: 0
  node_size_factor: 1.0
  edge_width_factor: 1.0
  color_scheme: "default"
  interactive: true

# Analysis
analysis:
  metrics:
    - "free_energy"
    - "prediction_error"
    - "complexity"
    - "accuracy"
  log_level: "INFO"
  save_history: true
  history_length: 1000

# Integration
obsidian:
  vault_path: "./"
  sync_interval: 300 # seconds
  backup_enabled: true
  backup_interval: 86400 # daily

# Logging
logging:
  level: "INFO"
  file: "logs/cognitive_model.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  max_size: 10485760 # 10MB
  backup_count: 5

# Development
development:
  debug: false
  profile: false
  test_mode: false
