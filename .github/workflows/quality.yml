name: quality

on:
  push:
  pull_request:

# The workflow only reads the repository. Declaring that here replaces the
# broad default token scope with the narrowest one that still works.
permissions:
  contents: read

# A branch that receives a second push while the first is still running does
# not need both results; cancel the stale run rather than paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # Installing the document toolchain lets the manuscript render test run
      # in CI instead of skipping; the PDF render still skips because the
      # runner has no XeLaTeX, and only the HTML render is asserted there.
      - name: Install document toolchain
        run: sudo apt-get update && sudo apt-get install -y pandoc pandoc-crossref

      # Coverage is measured across every module in the configured source
      # tree, with branch coverage on and no report include filter. The floor
      # lives in pyproject.toml.
      - name: Test
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q -p pytest_cov --cov

      - name: Static checks
        run: |
          ruff check .
          mypy code/tools/src code/Things code/scripts
          python -m compileall -q code

      - name: Documentation and links
        run: python code/scripts/validate_docs.py --json

      - name: Explicit link gate
        run: python code/scripts/verify_links.py . --json

      # The manuscript builder and the benchmark runner are installed entry
      # points that no other step executes. Running them here means a break in
      # either surfaces on the commit that caused it rather than at release
      # time. With pandoc and pandoc-crossref installed above, the HTML render
      # runs for real; the PDF stage still skips because the runner has no
      # XeLaTeX.
      - name: Executable manuscript pipeline
        run: |
          python -m scripts.build_manuscript --no-render --output "${RUNNER_TEMP}/no-render"
          python -m scripts.build_manuscript --no-pdf --output "${RUNNER_TEMP}/manuscript"
          python - <<'PY'
          import json, os, pathlib
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "manuscript"
          manifest = json.loads((output / "build_manifest.json").read_text())
          # A skipped render must never read as a passing render.
          assert manifest["rendered_documents"] is True, manifest
          html = (output / "manuscript.html").read_text()
          for leftover in ("{{", "[@fig:", "[@sec:", "[@eq:", "[@tbl:"):
              assert leftover not in html, f"unresolved {leftover!r} in rendered HTML"
          print(f"rendered manuscript is fully resolved ({len(html)} bytes)")
          PY

      - name: Benchmarks
        run: cognitive-benchmark --repetitions 1 --output "${RUNNER_TEMP}/benchmarks.json"

  # Coverage proves a line ran. This job proves the suite would notice if a
  # line were wrong: each declared mutation is written to disk, its tests run,
  # and a mutation the suite still passes fails the job.
  mutation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Mutation gate
        run: python -m scripts.mutation_check --json

  build-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A package that imports cleanly from a source checkout can still fail to
      # build a distribution, and the declared entry points are only exercised
      # once something installs the wheel.
      - name: Build and verify the distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel and run the console scripts
        run: |
          python -m pip install dist/*.whl
          cognitive-verify-links --help
          cognitive-validate-docs --help
          cognitive-benchmark --help
          cognitive-create-node --help
          cognitive-build-manuscript --help
