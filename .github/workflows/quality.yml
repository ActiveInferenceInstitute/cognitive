name: quality

on:
  push:
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test
        run: |
          coverage erase
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m coverage run -m pytest -q
          coverage report -m
      - name: Static checks
        run: |
          ruff check .
          mypy code/tools/src code/Things code/scripts
          python -m compileall -q code
      - name: Documentation and links
        run: python code/scripts/validate_docs.py --json
      - name: Explicit link gate
        run: python code/scripts/verify_links.py . --json
