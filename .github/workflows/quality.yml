name: quality

on:
  push:
  pull_request:

# The workflow only reads the repository. Declaring that here replaces the
# broad default token scope with the narrowest one that still works.
permissions:
  contents: read

# A branch that receives a second push while the first is still running does
# not need both results; cancel the stale run rather than paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite on every supported interpreter, with branch coverage across the
  # whole configured source tree against the floor in pyproject.toml.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q -p pytest_cov --cov

  # Everything that does not depend on the interpreter version runs once.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Static checks
        run: |
          ruff check .
          ruff format --check code
          mypy code/tools/src code/Things code/scripts
          python -m compileall -q code

      # Frontmatter, catalogs, wiki links, Markdown links, fenced Python and
      # the term policy.
      - name: Documentation and links
        run: python code/scripts/validate_docs.py --json

      # Ubuntu's archive does not carry pandoc-crossref, and a crossref binary
      # only loads under the Pandoc it was built against, so both come from
      # their release pages as a pinned pair (crossref v0.3.26 is built with
      # Pandoc 3.12.1). Bump the two versions together.
      - name: Install document toolchain
        env:
          PANDOC_VERSION: "3.12.1"
          CROSSREF_VERSION: "0.3.26"
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo apt-get install -y "$RUNNER_TEMP/pandoc.deb"
          curl -fsSL -o "$RUNNER_TEMP/crossref.tar.xz" \
            "https://github.com/lierdakil/pandoc-crossref/releases/download/v${CROSSREF_VERSION}/pandoc-crossref-Linux-X64.tar.xz"
          mkdir "$RUNNER_TEMP/crossref"
          tar -xJf "$RUNNER_TEMP/crossref.tar.xz" -C "$RUNNER_TEMP/crossref"
          sudo install -m 0755 "$RUNNER_TEMP/crossref/pandoc-crossref" /usr/local/bin/pandoc-crossref
          pandoc --version | head -1
          pandoc-crossref --version

      # The runner has no XeLaTeX, so the PDF stage is skipped and only the
      # HTML render is asserted. A skipped render must never read as a pass.
      - name: Manuscript pipeline
        run: |
          python -m scripts.build_manuscript --no-render --output "${RUNNER_TEMP}/no-render"
          python -m scripts.build_manuscript --no-pdf --output "${RUNNER_TEMP}/manuscript"
          python - <<'PY'
          import json, os, pathlib
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "manuscript"
          manifest = json.loads((output / "build_manifest.json").read_text())
          assert manifest["rendered_documents"] is True, manifest
          html = (output / "manuscript.html").read_text()
          for leftover in ("{{", "[@fig:", "[@sec:", "[@eq:", "[@tbl:"):
              assert leftover not in html, f"unresolved {leftover!r} in rendered HTML"
          print(f"rendered manuscript is fully resolved ({len(html)} bytes)")
          PY

      - name: Benchmarks
        run: cognitive-benchmark --repetitions 1 --output "${RUNNER_TEMP}/benchmarks.json"

  # Coverage proves a line ran. This job proves the suite would notice if a
  # line were wrong: each declared mutation is written to disk, its tests run,
  # and a mutation the suite still passes fails the job.
  mutation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python -m scripts.mutation_check --json

  # A package that imports from a checkout can still fail to build, and the
  # declared entry points only run once something installs the wheel.
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          python -m pip install dist/*.whl
          for command in cognitive-verify-links cognitive-validate-docs cognitive-normalize-frontmatter \
                         cognitive-kb-index cognitive-export-rdf cognitive-benchmark cognitive-create-node cognitive-build-manuscript; do
            "$command" --help > /dev/null
          done
