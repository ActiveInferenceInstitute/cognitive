name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reuse one locked project environment instead of installing it independently
  # for tests, static/docs checks, mutation checks, packaging and OKN replay.
  tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint and byte compilation
        run: ./run.sh lint
      - name: Types
        run: ./run.sh types
      - name: Full tests with whole-package branch coverage
        run: ./run.sh test-full
      - name: Documentation, links and graph checks
        run: ./run.sh docs

      # The archive lacks crossref. Install the compatible pinned release pair.
      - name: Install document toolchain
        env:
          PANDOC_VERSION: "3.12.1"
          CROSSREF_VERSION: "0.3.26"
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo apt-get install -y "$RUNNER_TEMP/pandoc.deb"
          curl -fsSL -o "$RUNNER_TEMP/crossref.tar.xz" \
            "https://github.com/lierdakil/pandoc-crossref/releases/download/v${CROSSREF_VERSION}/pandoc-crossref-Linux-X64.tar.xz"
          mkdir "$RUNNER_TEMP/crossref"
          tar -xJf "$RUNNER_TEMP/crossref.tar.xz" -C "$RUNNER_TEMP/crossref"
          sudo install -m 0755 "$RUNNER_TEMP/crossref/pandoc-crossref" /usr/local/bin/pandoc-crossref
          pandoc --version | head -1
          pandoc-crossref --version
      - name: Manuscript source and HTML (runner has no XeLaTeX)
        run: ./run.sh manuscript --output "$RUNNER_TEMP/manuscript"
      - name: Benchmarks
        run: uv run --locked --extra dev cognitive-benchmark --repetitions 1 --output "$RUNNER_TEMP/benchmarks.json"
      - name: Mutation gate
        run: uv run --locked --extra dev python -m scripts.mutation_check --json
      - name: Build and install the wheel in an independent environment
        run: |
          set -euo pipefail
          uv run --locked --extra dev python -m build --no-isolation --outdir "$RUNNER_TEMP/dist"
          uv run --locked --extra dev python -m twine check "$RUNNER_TEMP"/dist/*
          uv export --locked --extra dev --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt"
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-smoke"
          uv pip sync --python "$RUNNER_TEMP/wheel-smoke/bin/python" "$RUNNER_TEMP/requirements.txt"
          uv pip install --no-deps --python "$RUNNER_TEMP/wheel-smoke/bin/python" "$RUNNER_TEMP"/dist/*.whl
          export PATH="$RUNNER_TEMP/wheel-smoke/bin:$PATH"
          cd "$RUNNER_TEMP"
          for command in cognitive cognitive-verify-links cognitive-validate-docs cognitive-normalize-frontmatter \
                         cognitive-kb-index cognitive-export-rdf cognitive-kb-report cognitive-benchmark cognitive-create-node cognitive-build-manuscript cognitive-mutation-check; do
            "$command" --help > /dev/null
          done
          for command in simulate sweep plot continuous hierarchical; do
            cognitive "$command" --help > /dev/null
          done
      # The optional methods are part of the same lock; install them only for replay.
      - name: Export and replay captured cross-graph evidence
        run: |
          uv run --locked --extra dev --extra replay python -m scripts.export_rdf
          uv run --locked --extra dev --extra replay daf-okn join --source output/okn/cognitive-kb.nq \
            --query docs/okn/queries/cross_graph_obo.rq \
            --replay docs/okn/evidence/2026-10-23-entity-model \
            --output "$RUNNER_TEMP/cognitive-okn-replay"
          uv run --locked --extra dev --extra replay daf-okn explain-join --source output/okn/cognitive-kb.nq \
            --query docs/okn/queries/cross_graph_obo.rq \
            --capture docs/okn/evidence/2026-10-23-entity-model \
            --output docs/okn/explanations/2026-10-23-entity-model --check

  # Preserve the required GNN context and keep the pinned parser's dependency
  # environment separate from the locked importer environment.
  gnn-conformance:
    name: gnn conformance (pinned)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: "3.12"
      - name: Provision, validate and require pinned parser conformance
        run: ./run.sh gnn --provision --runtime "$RUNNER_TEMP/gnn-runtime/bin/python"
