# AII sidecar — InstituteOS metadata. Schema: instituteos.platform.aii_sidecar
meta:
  updated: '2026-11-01'
repo:
  name: cognitive
  slug: cognitive
  full_name: ActiveInferenceInstitute/cognitive
  description: Tested Python package for Active Inference agents and an Obsidian knowledge base of
    linked pages on the mathematics, biology, cognitive science and philosophy behind it.
institute:
  category: research-software
  maturity: released
  steward: Active Inference Institute
ecosystem:
  relations:
  - repo: ActiveInferenceInstitute/InstituteOS
    relation: referenced-by
    note: Federated via the InstituteOS .aii manifest.
  - repo: ActiveInferenceInstitute/Active_Inference_Ontology
    note: Uses Active Inference Ontology terms.
  - repo: ActiveInferenceInstitute/Generalized_Notation_Notation
    note: Canonical discrete model declared in GNN; the parser revision is pinned in specs/gnn-pin.json.
  links:
    github: https://github.com/ActiveInferenceInstitute/cognitive
    website: https://www.activeinference.org
artifacts:
- path: README.md
  kind: doc
  description: Repository overview.
- path: LICENSE
  kind: doc
  description: License.
- path: specs/discrete_variational.gnn.md
  kind: doc
  description: GNN declaration of the canonical discrete model.
- path: specs/gnn-pin.json
  kind: data
  description: Pinned upstream GNN parser revision with parser-file digests.
- path: docs/gnn.md
  kind: doc
  description: Model specification - the declaration, its binding, and the validation commands.
- path: code/tools/src/models/active_inference/config_examples/discrete_variational.yaml
  kind: data
  description: Canonical runtime configuration bound to the declaration.
- path: code/tools/src/models/active_inference/gnn_spec.py
  kind: code
  description: Reader for the committed GNN declaration (standard library plus NumPy).
- path: code/scripts/validate_gnn_spec.py
  kind: tool
  description: GNN conformance validator - semantics plus the pinned parser.
- path: code/tests/test_gnn_conformance.py
  kind: test
  description: Binds the declaration to the canonical configuration and negative controls.
- path: code/tests/gnn_parser_probe.py
  kind: tool
  description: The only module that imports the upstream GNN parser; prints JSON.
provenance:
  license: MIT
  citation:
    text: Active Inference Institute — cognitive.
